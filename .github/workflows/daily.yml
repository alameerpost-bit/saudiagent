name: Daily signals
run-name: Daily signals ${{ inputs.watchdog_fallback && 'watchdog-fallback' || 'scheduled-or-manual' }}
on:
  schedule:
    - cron: "15 13 * * 0-4"  # 16:15 بتوقيت الرياض، الأحد-الخميس (UTC)
  workflow_dispatch:
    inputs:
      watchdog_fallback:
        description: "Started by the schedule watchdog"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-signals-main
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py run
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
      - name: Save closing recommendations for morning review
        if: success()
        run: |
          if [ -f data/previous_signals.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/previous_signals.json
            if ! git diff --cached --quiet; then
              git commit -m "Save closing recommendations for morning review"
              git push
            fi
          else
            echo "No newly generated recommendations state to save."
          fi
      - name: Upload run audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-agent-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/audit/run.json
          if-no-files-found: warn
          retention-days: 30
