name: Schedule watchdog
on:
  schedule:
    - cron: "30 13 * * 0-4" # 16:30 بتوقيت الرياض، الأحد-الخميس
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Prevent two watchdog instances from checking and dispatching simultaneously.
concurrency:
  group: saudi-agent-schedule-watchdog
  cancel-in-progress: false

jobs:
  check-daily-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect daily run and recover safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: python scripts/watchdog.py
