name: Schedule watchdog
on:
  schedule:
    - cron: "30 13 * * 0-4" # 16:30 بتوقيت الرياض، الأحد-الخميس
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check-daily-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check Daily signals and dispatch a fallback if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Riyadh")
          today = datetime.now(tz).date()
          repo = os.environ["GH_REPOSITORY"]
          api = os.environ.get("GH_API_URL", "https://api.github.com")
          token = os.environ["GH_TOKEN"]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw.decode()) if raw else None

          def telegram(message):
              bot_token = os.environ.get("TELEGRAM_TOKEN")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID")
              if not bot_token or not chat_id:
                  raise RuntimeError("TELEGRAM_TOKEN أو TELEGRAM_CHAT_ID غير مضبوط.")
              body = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data=body,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read().decode())
              if result.get("ok") is not True:
                  raise RuntimeError("Telegram لم يؤكد إرسال التنبيه.")
              print("Telegram alert sent.")

          try:
              query = urllib.parse.urlencode({
                  "branch": "main",
                  "per_page": 50,
              })
              runs_url = f"{api}/repos/{repo}/actions/workflows/daily.yml/runs?{query}"
              data = request_json(runs_url)

              todays_runs = []
              for run in data.get("workflow_runs", []):
                  created = datetime.fromisoformat(
                      run["created_at"].replace("Z", "+00:00")
                  ).astimezone(tz)
                  if created.date() == today:
                      todays_runs.append(run)

              if not todays_runs:
                  dispatch_url = f"{api}/repos/{repo}/actions/workflows/daily.yml/dispatches"
                  request_json(dispatch_url, method="POST", payload={"ref": "main"})
                  telegram(
                      "⚠️ مراقب بوت التداول: لم يُعثر على تشغيل Daily signals اليوم "
                      f"({today}) حتى 16:30 بتوقيت الرياض.\n"
                      "تم إطلاق تشغيل احتياطي تلقائي عبر workflow_dispatch. "
                      "تابع GitHub Actions للتأكد من النتيجة.\n"
                      "لم يتم تغيير الاستراتيجية أو تنفيذ أي أوامر تداول."
                  )
                  print("Fallback workflow_dispatch sent.")
                  sys.exit(0)

              latest = max(todays_runs, key=lambda item: item["created_at"])
              status = latest.get("status")
              conclusion = latest.get("conclusion")
              event = latest.get("event")
              run_url = latest.get("html_url", "")

              if status == "completed" and conclusion != "success":
                  telegram(
                      "⚠️ تعثر تشغيل بوت التداول\n"
                      f"آخر تشغيل اليوم ({today}) انتهى بالحالة: "
                      f"{conclusion or 'غير معروفة'} (event={event}).\n"
                      f"تفاصيل التشغيل: {run_url}\n"
                      "لم يتم تنفيذ أي أوامر تداول."
                  )
              else:
                  print(
                      f"Daily signals run found: status={status}, "
                      f"conclusion={conclusion}, event={event}, url={run_url}"
                  )
          except Exception as exc:
              print(f"Watchdog check failed: {exc}", file=sys.stderr)
              try:
                  telegram(
                      "⚠️ تعذر على مراقب الجدولة التحقق أو إطلاق التشغيل الاحتياطي "
                      f"لبوت التداول اليوم ({today}).\nالسبب: {str(exc)[:1000]}\n"
                      "يرجى فحص Schedule watchdog في GitHub Actions."
                  )
              except Exception as alert_exc:
                  print(f"Telegram alert failed: {alert_exc}", file=sys.stderr)
              raise
          PY
