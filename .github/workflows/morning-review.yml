name: Morning price review
run-name: Morning price review ${{ inputs.watchdog_fallback && 'watchdog-fallback' || 'scheduled-or-manual' }}
on:
  schedule:
    - cron: "15 7 * * 0-4"   # 10:15 بتوقيت الرياض، الأحد-الخميس (UTC)
  workflow_dispatch:
    inputs:
      watchdog_fallback:
        description: "Started by the morning review watchdog"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: morning-price-review-main
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - run: python bot.py review
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAHMK_API_KEY: ${{ secrets.SAHMK_API_KEY }}
      - name: Verify functional review and Telegram delivery
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: python scripts/verify_run_audit.py
      - name: Upload run audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saudi-agent-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/audit/run.json
          if-no-files-found: warn
          retention-days: 30
